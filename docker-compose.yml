services:
  app:
    container_name: rust-crud-sql-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    # DATABASE_URL / JWT_SECRET / ARGON_SECRET / HOST come from here; the
    # binary has no defaults for them and exits on startup if they are unset
    env_file:
      - .env.dev
    environment:
      COMPOSE_CONVERT_WINDOWS_PATHS: 1

  db:
    container_name: rust-crud-sql-db
    image: postgres:18.4-alpine3.24
    user: 'root'
    ports:
      - "5434:5432"
    volumes:
      - ./data:/var/lib/postgresql
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d demo" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  adminer:
    container_name: rust-crud-sql-adminer
    image: adminer
    restart: always
    ports:
      - "8080:8080"