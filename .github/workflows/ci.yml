name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # queries are resolved from the committed .sqlx cache, so no database is needed
  SQLX_OFFLINE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  sqlx-check:
    name: sqlx Query Cache
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # this job re-derives the query metadata against a live database,
      # so it must not read the committed cache
      SQLX_OFFLINE: false
      DATABASE_URL: postgres://demo:demo@localhost:5432/demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev pkg-config libssl-dev postgresql-client

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx >/dev/null 2>&1; then
            cargo install sqlx-cli --version '^0.7' --no-default-features --features postgres,rustls --locked
          fi

      - name: Load database schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/initial.sql

      - name: Verify .sqlx cache is up to date
        run: |
          cargo sqlx prepare --check -- --bin rust-crud-sql \
            || { echo "::error::.sqlx is stale. Run 'cargo sqlx prepare -- --bin rust-crud-sql' and commit the result."; exit 1; }

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: rust-crud-sql-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: docker run --rm rust-crud-sql-api:${{ github.sha }} rust-crud-sql --help
